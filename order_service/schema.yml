                  value:
                    status: completed
                  summary: Ví dụ cập nhật trạng thái đơn hàng sang completed
                VíDụHủyĐơnHàng:
                  value:
                    status: cancelled
                  summary: Ví dụ hủy đơn hàng
          description: Cập nhật đơn hàng thành công
        '400':
          description: Dữ liệu cập nhật không hợp lệ.
        '404':
          description: Không tìm thấy đơn hàng cần cập nhật.
        '401':
          description: Chưa xác thực qua Auth Service.
    patch:
      operationId: api_orders_partial_update
      description: |-
        Controller xử lý:
        - GET /orders/<id>: Chi tiết đơn hàng
        - PUT/PATCH /orders/<id>: Cập nhật trạng thái đơn hàng
        - DELETE /orders/<id>: Xóa đơn hàng
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdateRequest'
            examples:
              VíDụCậpNhậtTrạngTháiĐơnHàngSangCompleted:
                value:
                  status: completed
                summary: Ví dụ cập nhật trạng thái đơn hàng sang completed
              VíDụHủyĐơnHàng:
                value:
                  status: cancelled
                summary: Ví dụ hủy đơn hàng
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdateRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
