        - **PUT /orders/<id>** hoặc **PATCH**: Cập nhật trạng thái đơn hàng (pending, completed, cancelled) hoặc thông tin khách hàng.
        - **DELETE /orders/<id>**: Xóa một đơn hàng khỏi hệ thống.
      summary: 2. Chi tiết, Cập nhật trạng thái và Xóa đơn hàng theo ID
      parameters:
