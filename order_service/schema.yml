openapi: 3.0.3
info:
  title: Order Management Service (SOA - Bài Thực Hành Số 4)
  version: 1.0.0
  description: |-
    Dịch vụ quản lý đơn hàng hoạt động độc lập trên cổng 8002 và cơ sở dữ liệu riêng (orders_db.sqlite3).
    - Xác thực người dùng thông qua Auth Service đã xây dựng ở Bài thực hành số 2 (cổng 8000).
    - Tương tác liên dịch vụ (Inter-Service) kiểm tra tồn kho từ Product Service (cổng 8001).
paths:
  /api/order_items/:
    get:
      operationId: api_order_items_retrieve
      description: |-
        **Yêu cầu xác thực qua Auth Service (Bài 2)**: Header `Authorization: Bearer <token>`.

        - **GET /order_items**: Lấy danh sách tất cả các mặt hàng (hỗ trợ lọc `?order_id=<id>`).
        - **POST /order_items**: Tạo mặt hàng mới trong đơn hàng, tự động kiểm tra tồn kho từ Product Service và cập nhật lại `total_amount` của đơn hàng.
      summary: 3. Lấy danh sách hoặc Thêm mới mặt hàng trong đơn hàng
      parameters:
      - in: query
        name: order_id
        schema:
          type: integer
        description: Lọc danh sách mặt hàng thuộc về một đơn hàng cụ thể
      tags:
      - api
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemListResponse'
          description: Lấy danh sách mặt hàng thành công
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ.
    post:
      operationId: api_order_items_create
      description: |-
        Controller xử lý:
        - GET /order_items: Lấy danh sách tất cả mặt hàng trong đơn hàng
        - POST /order_items: Tạo mặt hàng mới (kiểm tra tồn kho qua Product Service)
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemCreateRequest'
            examples:
              VíDụThêmMộtMặtHàngVàoĐơnHàng:
                value:
                  order_id: 1
                  product_id: 3
                  quantity: 2
                summary: Ví dụ thêm một mặt hàng vào đơn hàng
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderItemCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderItemCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
              examples:
                VíDụThêmMộtMặtHàngVàoĐơnHàng:
                  value:
                    order_id: 1
                    product_id: 3
                    quantity: 2
                  summary: Ví dụ thêm một mặt hàng vào đơn hàng
          description: Tạo mặt hàng mới thành công
        '400':
          description: Dữ liệu mặt hàng không hợp lệ hoặc sản phẩm không đủ tồn kho.
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ.
  /api/order_items/{id}/:
    get:
      operationId: api_order_items_retrieve_2
      description: |-
        **Yêu cầu xác thực qua Auth Service (Bài 2)**: Header `Authorization: Bearer <token>`.

        - **GET /order_items/<id>**: Lấy thông tin chi tiết một mặt hàng.
        - **PUT/PATCH /order_items/<id>**: Cập nhật mặt hàng (tự động tính lại tổng tiền đơn hàng).
        - **DELETE /order_items/<id>**: Xóa một mặt hàng khỏi đơn hàng (tự động tính lại tổng tiền đơn hàng).
      summary: 4. Chi tiết, Cập nhật và Xóa một mặt hàng theo ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: ID duy nhất của chi tiết đơn hàng
        required: true
      tags:
      - api
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
          description: Lấy chi tiết mặt hàng thành công
        '404':
          description: Không tìm thấy mặt hàng với ID cung cấp.
        '401':
          description: Chưa xác thực qua Auth Service.
    put:
      operationId: api_order_items_update
      description: |-
        Controller xử lý:
        - GET /order_items/<id>: Lấy thông tin chi tiết một mặt hàng
        - PUT/PATCH /order_items/<id>: Cập nhật mặt hàng
        - DELETE /order_items/<id>: Xóa một mặt hàng trong đơn hàng
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderItemUpdateRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
          description: Cập nhật mặt hàng thành công
        '400':
          description: Dữ liệu cập nhật không hợp lệ.
        '404':
          description: Không tìm thấy mặt hàng cần cập nhật.
        '401':
          description: Chưa xác thực qua Auth Service.
    patch:
      operationId: api_order_items_partial_update
      description: |-
        Controller xử lý:
        - GET /order_items/<id>: Lấy thông tin chi tiết một mặt hàng
        - PUT/PATCH /order_items/<id>: Cập nhật mặt hàng
        - DELETE /order_items/<id>: Xóa một mặt hàng trong đơn hàng
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderItemUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderItemUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderItemUpdateRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponse'
          description: Cập nhật mặt hàng thành công
        '400':
          description: Dữ liệu cập nhật không hợp lệ.
        '404':
          description: Không tìm thấy mặt hàng cần cập nhật.
        '401':
          description: Chưa xác thực qua Auth Service.
    delete:
      operationId: api_order_items_destroy
      description: |-
        Controller xử lý:
        - GET /order_items/<id>: Lấy thông tin chi tiết một mặt hàng
        - PUT/PATCH /order_items/<id>: Cập nhật mặt hàng
        - DELETE /order_items/<id>: Xóa một mặt hàng trong đơn hàng
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Xóa mặt hàng khỏi đơn hàng thành công
        '404':
          description: Không tìm thấy mặt hàng cần xóa.
        '401':
          description: Chưa xác thực qua Auth Service.
  /api/orders/:
    get:
      operationId: api_orders_retrieve
      description: |-
        **Yêu cầu xác thực qua Auth Service (Bài 2)**: Header `Authorization: Bearer <token>`.

        - **GET /orders**: Lấy danh sách tất cả các đơn hàng (hỗ trợ lọc `?status=pending|completed|cancelled` và `?search=...`).
        - **POST /orders**: Tạo đơn hàng mới. Tự động liên lạc sang **Product Service** (cổng 8001) để kiểm tra tồn kho và đơn giá sản phẩm.
      summary: 1. Lấy danh sách hoặc Tạo mới đơn hàng
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Tìm kiếm theo tên khách hàng hoặc email
      - in: query
        name: status
        schema:
          type: string
        description: Lọc theo trạng thái đơn hàng (pending, completed, cancelled)
      tags:
      - api
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
          description: Lấy danh sách đơn hàng thành công
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ.
    post:
      operationId: api_orders_create
      description: |-
        Controller xử lý:
        - GET /orders: Lấy danh sách tất cả đơn hàng
        - POST /orders: Tạo đơn hàng mới (kiểm tra tồn kho qua Product Service)
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            examples:
              VíDụTạoĐơnHàngKèmDanhSáchSảnPhẩm:
                value:
                  customer_name: Nguyễn Văn An
                  customer_email: an.nguyen@example.com
                  status: pending
                  items:
                  - product_id: 1
                    quantity: 2
                  - product_id: 2
                    quantity: 1
                summary: Ví dụ tạo đơn hàng kèm danh sách sản phẩm
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                VíDụTạoĐơnHàngKèmDanhSáchSảnPhẩm:
                  value:
                    customer_name: Nguyễn Văn An
                    customer_email: an.nguyen@example.com
                    status: pending
                    items:
                    - product_id: 1
                      quantity: 2
                    - product_id: 2
                      quantity: 1
                  summary: Ví dụ tạo đơn hàng kèm danh sách sản phẩm
          description: Tạo đơn hàng thành công
        '400':
          description: Dữ liệu không hợp lệ hoặc sản phẩm không đủ tồn kho.
        '401':
          description: Chưa đăng nhập hoặc token không hợp lệ.
  /api/orders/{id}/:
    get:
      operationId: api_orders_retrieve_2
      description: |-
