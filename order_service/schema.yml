        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: ID duy nhất của đơn hàng
        required: true
      tags:
      - api
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          description: Lấy chi tiết đơn hàng thành công
        '404':
          description: Không tìm thấy đơn hàng với ID cung cấp.
