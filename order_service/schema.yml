components:
  schemas:
    Order:
      type: object
      description: Serializer hiển thị thông tin đơn hàng cùng danh sách chi tiết
        các mặt hàng.
      properties:
        id:
          type: integer
          readOnly: true
          description: ID duy nhất của đơn hàng
        customer_name:
          type: string
          description: Tên khách hàng
          maxLength: 255
        customer_email:
          type: string
          description: Email khách hàng
          maxLength: 255
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Tổng số tiền của đơn hàng
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Trạng thái của đơn hàng (pending, completed, cancelled)

            * `pending` - Pending
            * `completed` - Completed
            * `cancelled` - Cancelled
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Ngày đơn hàng được tạo
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Ngày đơn hàng được cập nhật lần cuối
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
      required:
      - created_at
      - customer_email
      - customer_name
      - id
      - items
      - total_amount
      - updated_at
    OrderCreateRequest:
      type: object
      description: |-
        Serializer tiếp nhận yêu cầu tạo đơn hàng mới (POST /orders).
        Hỗ trợ tạo đơn hàng kèm luôn danh sách các sản phẩm (items).
      properties:
        customer_name:
          type: string
          minLength: 1
          description: Tên khách hàng
          maxLength: 255
        customer_email:
          type: string
          format: email
          minLength: 1
          description: Email khách hàng
          maxLength: 255
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          default: pending
          description: |-
            Trạng thái ban đầu của đơn hàng (mặc định: pending)

            * `pending` - Pending
            * `completed` - Completed
            * `cancelled` - Cancelled
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemNestedInputRequest'
          description: Danh sách mặt hàng đặt mua kèm theo
      required:
      - customer_email
      - customer_name
    OrderItem:
      type: object
      description: Serializer hiển thị đầy đủ thông tin một chi tiết đơn hàng (order_items).
      properties:
        id:
          type: integer
          readOnly: true
          description: ID duy nhất của chi tiết đơn hàng
        order_id:
          type: integer
          readOnly: true
        product_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: ID sản phẩm (lưu vết để liên kết với dịch vụ quản lý sản phẩm)
        product_name:
          type: string
          description: Tên sản phẩm
          maxLength: 255
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Số lượng sản phẩm trong đơn hàng
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Giá sản phẩm tại thời điểm đặt hàng
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Tổng giá trị cho từng sản phẩm (quantity * unit_price)
      required:
      - id
      - order_id
      - product_id
      - product_name
      - total_price
      - unit_price
    OrderItemCreateRequest:
      type: object
      description: Serializer cho API thêm mới mặt hàng trực tiếp (POST /order_items).
      properties:
        order_id:
          type: integer
          description: ID của đơn hàng muốn thêm mặt hàng vào
        product_id:
          type: integer
          description: ID của sản phẩm trong Product Service
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Số lượng mua (>= 1)
        product_name:
          type: string
          description: Tùy chọn. Nếu không truyền, hệ thống sẽ tự động lấy từ Product
            Service.
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Tùy chọn. Nếu không truyền, hệ thống sẽ tự động lấy từ Product
            Service.
      required:
      - order_id
      - product_id
    OrderItemListResponse:
      type: object
      properties:
        message:
          type: string
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
      - data
      - message
      - total
    OrderItemNestedInputRequest:
      type: object
      description: Serializer nhập dữ liệu chi tiết sản phẩm lồng trong request tạo
        đơn hàng (POST /orders).
      properties:
        product_id:
          type: integer
          description: ID của sản phẩm trong Product Service
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Số lượng mua (>= 1)
        product_name:
          type: string
          description: Tùy chọn. Nếu không truyền, hệ thống sẽ tự động lấy từ Product
            Service.
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Tùy chọn. Nếu không truyền, hệ thống sẽ tự động lấy từ Product
            Service.
      required:
      - product_id
    OrderItemResponse:
      type: object
      properties:
        message:
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/OrderItem'
          nullable: true
      required:
      - data
      - message
    OrderItemUpdateRequest:
      type: object
      description: Serializer cho API cập nhật mặt hàng (PUT/PATCH /order_items/<id>).
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Số lượng mới
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Đơn giá mới
        product_name:
          type: string
          minLength: 1
          description: Tên sản phẩm mới
          maxLength: 255
    OrderListResponse:
      type: object
      properties:
        message:
          type: string
        total:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
      - data
      - message
      - total
    OrderResponse:
      type: object
      properties:
        message:
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/Order'
          nullable: true
      required:
      - data
      - message
    OrderUpdateRequest:
      type: object
      description: Serializer cập nhật thông tin đơn hàng / trạng thái đơn hàng (PUT/PATCH
        /orders/<id>).
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Trạng thái mới của đơn hàng (pending, completed, cancelled)

            * `pending` - Pending
            * `completed` - Completed
            * `cancelled` - Cancelled
        customer_name:
          type: string
          minLength: 1
          description: Tên khách hàng mới
          maxLength: 255
        customer_email:
          type: string
          format: email
          minLength: 1
          description: Email khách hàng mới
          maxLength: 255
    PatchedOrderItemUpdateRequest:
      type: object
      description: Serializer cho API cập nhật mặt hàng (PUT/PATCH /order_items/<id>).
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Số lượng mới
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Đơn giá mới
        product_name:
          type: string
          minLength: 1
          description: Tên sản phẩm mới
          maxLength: 255
    PatchedOrderUpdateRequest:
      type: object
      description: Serializer cập nhật thông tin đơn hàng / trạng thái đơn hàng (PUT/PATCH
        /orders/<id>).
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Trạng thái mới của đơn hàng (pending, completed, cancelled)

            * `pending` - Pending
            * `completed` - Completed
            * `cancelled` - Cancelled
        customer_name:
          type: string
          minLength: 1
          description: Tên khách hàng mới
          maxLength: 255
        customer_email:
          type: string
          format: email
          minLength: 1
          description: Email khách hàng mới
          maxLength: 255
    StatusEnum:
      enum:
      - pending
      - completed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `cancelled` - Cancelled
  securitySchemes:
    BearerAuth:
      type: http
